<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | SPAN GAMES</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="css/acessibilidade.css">
</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <div id="header"></div>

    <!-- =========================================
         CONTEÚDO PRINCIPAL
    ========================================== -->

    <main>

        <form id="formCadastro" novalidate>

            <h1>CADASTRO</h1>


            <!-- =========================================
                 DADOS PESSOAIS
            ========================================== -->

            <section>

                <h2>
                    <img
                        src="assets/icones/dados-pessoais.svg"
                        alt=""
                    >
                    Dados Pessoais
                </h2>

                <div class="campos">

                    <!-- NOME -->
                    <div class="campo">

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            autocomplete="name"
                        >

                        <label for="nome">
                            Nome completo
                        </label>

                        <span
                            class="mensagem-erro"
                            id="erroNome"
                        ></span>

                    </div>


                    <!-- CPF -->
                    <div class="campo">

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            inputmode="numeric"
                            maxlength="14"
                        >

                        <label for="cpf">
                            CPF
                        </label>

                        <span
                            class="mensagem-erro"
                            id="erroCpf"
                        ></span>

                    </div>


                    <!-- E-MAIL -->
                    <div class="campo campo-email">

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                        >

                        <label for="email">
                            E-mail
                        </label>

                        <span
                            class="mensagem-erro"
                            id="erroEmail"
                        ></span>

                    </div>

                </div>

            </section>


            <!-- =========================================
                 CONTATO
            ========================================== -->

            <section>

                <h2>
                    <img
                        src="assets/icones/contato.svg"
                        alt=""
                    >
                    Contato
                </h2>

                <div class="campos">

                    <!-- CELULAR -->
                    <div class="campo">

                        <input
                            type="tel"
                            id="celular"
                            name="celular"
                            inputmode="numeric"
                        >

                        <label for="celular">
                            Telefone Celular
                        </label>

                        <span
                            class="mensagem-erro"
                            id="erroCelular"
                        ></span>

                    </div>


                    <!-- TELEFONE FIXO -->
                    <div class="campo">

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            inputmode="numeric"
                        >

                        <label for="telefone">
                            Telefone Fixo
                        </label>

                        <span
                            class="mensagem-erro"
                            id="erroTelefone"
                        ></span>

                    </div>

                </div>

            </section>


            <!-- =========================================
                 ENDEREÇO
            ========================================== -->

            <section>

                <h2>
                    <img
                        src="assets/icones/endereco.svg"
                        alt=""
                    >
                    Endereço
                </h2>

                <div class="campos">

                    <!-- CEP -->
                    <div class="campo">

                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            inputmode="numeric"
                            maxlength="9"
                        >

                        <label for="cep">
                            CEP
                        </label>

                        <span
                            class="mensagem-erro"
                            id="erroCep"
                        ></span>

                    </div>


                    <!-- RUA -->
                    <div class="campo">

                        <input
                            type="text"
                            id="rua"
                            name="rua"
                            autocomplete="street-address"
                            readonly
                        >

                        <label for="rua">
                            Rua
                        </label>

                        <span
                            class="mensagem-erro"
                            id="erroRua"
                        ></span>

                    </div>


                    <!-- CIDADE -->
                    <div class="campo">

                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            autocomplete="address-level2"
                            readonly
                        >

                        <label for="cidade">
                            Cidade
                        </label>

                        <span
                            class="mensagem-erro"
                            id="erroCidade"
                        ></span>

                    </div>


                    <!-- BAIRRO -->
                    <div class="campo">

                        <input
                            type="text"
                            id="bairro"
                            name="bairro"
                            autocomplete="address-line2"
                            readonly
                        >

                        <label for="bairro">
                            Bairro
                        </label>

                        <span
                            class="mensagem-erro"
                            id="erroBairro"
                        ></span>

                    </div>


                    <!-- UF -->
                    <div class="campo">

                        <input
                            type="text"
                            id="uf"
                            name="uf"
                            maxlength="2"
                            autocomplete="address-level1"
                            readonly
                        >

                        <label for="uf">
                            UF
                        </label>

                        <span
                            class="mensagem-erro"
                            id="erroUf"
                        ></span>

                    </div>


                    <!-- NÚMERO -->
                    <div class="campo">
                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            maxlength="10"
                            inputmode="numeric"
                            pattern="[0-9]*"
                        >

                        <label for="numero">Número da residência</label>

                        <span class="mensagem-erro" id="erroNumero"></span>
                    </div>

                </div>

            </section>


            <!-- =========================================
                 ACESSO
            ========================================== -->

            <section>

                <h2>
                    <img
                        src="assets/icones/acesso.svg"
                        alt=""
                    >
                    Acesso
                </h2>

                <div class="campos">

                    <!-- LOGIN -->
                    <div class="campo">

                        <input
                            type="text"
                            id="login"
                            name="login"
                            maxlength="6"
                        >

                        <label for="login">
                            Login
                        </label>

                        <span
                            class="mensagem-erro"
                            id="erroLogin"
                        ></span>

                    </div>


                    <!-- SENHA -->
                    <div class="campo">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            maxlength="8"
                        >

                        <label for="senha">
                            Senha
                        </label>

                        <button
                            type="button"
                            class="botao-olho"
                            id="mostrarSenha"
                        >
                            <img
                                src="assets/icones/eyeoff.svg"
                                alt="Mostrar senha"
                            >
                        </button>

                        <span
                            class="mensagem-erro"
                            id="erroSenha"
                        ></span>

                    </div>


                    <!-- CONFIRMAÇÃO DE SENHA -->
                    <div class="campo">

                        <input
                            type="password"
                            id="confirmacao"
                            name="confirmacao"
                            maxlength="8"
                        >

                        <label for="confirmacao">
                            Confirmação de senha
                        </label>

                        <button
                            type="button"
                            class="botao-olho"
                            id="mostrarConfirmacao"
                        >
                            <img
                                src="assets/icones/eyeoff.svg"
                                alt="Mostrar confirmação de senha"
                            >
                        </button>

                        <span
                            class="mensagem-erro"
                            id="erroConfirmacao"
                        ></span>

                    </div>

                </div>

            </section>


            <!-- =========================================
                 TERMOS
            ========================================== -->

            <div class="termos">

                <input
                    type="checkbox"
                    id="termos"
                    name="termos"
                >

                <label for="termos">
                    Estou ciente e <strong>CONCORDO</strong> com os termos e
                    políticas de privacidade da SPAN GAMES
                </label>

            </div>


            <span
                class="mensagem-erro erro-termos"
                id="erroTermos"
            ></span>


            <!-- =========================================
                 BOTÃO CADASTRAR
            ========================================== -->

            <button
                type="submit"
                class="botao-cadastrar"
            >
                Cadastrar
            </button>


            <!-- MENSAGEM DE SUCESSO -->

            <div
                class="mensagem-sucesso"
                id="mensagemSucesso"
            ></div>


            <!-- VOLTAR -->

            <a
                class="voltar"
                href="login.html"
            >
                Voltar para o login
            </a>

        </form>

    </main>

        <!-- FOOTER -->
    <footer>

        <div class="footer-final">

            <p>
                © 2026 SPAN Games — Todos os direitos reservados.
            </p>

        </div>

    </footer>
    

    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <!--
        O header.js carrega o header.html
        e depois carrega acessibilidade.js.
    -->
    <script src="js/header2.js"></script>

    <!-- JavaScript específico do cadastro -->
    <script src="js/cadastro.js"></script>

</body>

</html>
