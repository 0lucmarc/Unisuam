<!-- =========================================
     HEADER - SPAN GAMES
========================================= -->

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/acessibilidade.css">
<link rel="stylesheet" href="css/produtos.css">


<!-- =========================================
     BARRA DE ACESSIBILIDADE
========================================= -->

<div class="barra-acessibilidade">

    <div class="acessibilidade-central">

        <div class="acessibilidade-grupo">

            <span>Tema</span>

            <button
                id="temaClaro"
                type="button"
                title="Tema claro"
            >
                Claro
            </button>

            <button
                id="temaEscuro"
                type="button"
                title="Tema escuro"
            >
                Escuro
            </button>

        </div>


        <div class="acessibilidade-separador"></div>


        <div class="acessibilidade-grupo">

            <span>Fonte</span>

            <button
                id="diminuirFonte"
                type="button"
                title="Diminuir fonte"
            >
                A−
            </button>

            <button
                id="aumentarFonte"
                type="button"
                title="Aumentar fonte"
            >
                A+
            </button>

        </div>

    </div>

</div>


<!-- =========================================
     HEADER PRINCIPAL
========================================= -->

<header>

    <nav class="navbar">

        <!-- LOGO -->

        <a href="index.html" class="logo">
            SPAN <span>GAMES</span>
        </a>


        <!-- MENU PRINCIPAL -->

        <ul class="menu">

            <li>
                <a href="index.html">
                    Início
                </a>
            </li>

            <li>
                <a href="produtos.html">
                    Produtos
                </a>
            </li>

            <li>
                <a href="ofertas.html">
                    Ofertas
                </a>
            </li>

            <li>
                <a href="sobre.html">
                    Sobre nós
                </a>
            </li>

            <li>
                <a href="cadastroprodutos.html">
                    cadastro produtos
                </a>
            </li>

        </ul>


        <!-- ÁREA DIREITA -->

        <div class="nav-direita">


            <!-- PESQUISA -->

            <div class="pesquisa">

                <input
                    type="text"
                    placeholder="Buscar produtos..."
                >

                <i class="fa-solid fa-magnifying-glass"></i>

            </div>


            <!-- CARRINHO -->

            <a
                href="carrinho.html"
                class="carrinho"
            >

                <i class="fa-solid fa-cart-shopping"></i>

                <span id="contadorCarrinho">
                    0
                </span>

            </a>


            <!-- =====================================
                 USUÁRIO
            ====================================== -->

            <div
                class="usuario-menu"
                id="usuarioMenu"
            >

                <a
                    href="login.html"
                    class="login"
                    id="linkUsuario"
                >

                    <i class="fa-regular fa-user"></i>

                    <span id="textoUsuario">
                        Login / cadastro
                    </span>

                </a>


                <!-- MENU QUE APARECE NO HOVER -->

                <div
                    class="usuario-dropdown"
                    id="usuarioDropdown"
                >


                    <!-- EDITAR PERFIL -->

                    <a href="perfil.html">

                        <i class="fa-regular fa-user"></i>

                        <span>
                            Editar perfil
                        </span>

                    </a>


                    <!-- MEUS PEDIDOS -->

                    <a href="pedidos.html">

                        <i class="fa-solid fa-box"></i>

                        <span>
                            Meus pedidos
                        </span>

                    </a>


                    <!-- FEEDBACK -->

                    <a href="feedback.html">

                        <i class="fa-regular fa-message"></i>

                        <span>
                            Formulário de feedback
                        </span>

                    </a>


                    <!-- DIVISOR -->

                    <div class="usuario-divisor"></div>


                    <!-- SAIR -->

                    <button
                        type="button"
                        id="btnSair"
                    >

                        <i class="fa-solid fa-arrow-right-from-bracket"></i>

                        <span>
                            Sair
                        </span>

                    </button>

                </div>

            </div>

        </div>

    </nav>

</header>
