<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SPAN GAMES</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/acessibilidade.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <!-- HEADER -->
    <div id="header"></div>


    <!-- LOGIN -->
    <main class="pagina-login">

        <div class="login-container">

            <!-- LADO LOGIN -->
            <section class="login-card">

                <div class="login-titulo">
                    <span class="login-icone">
                        <i class="fa-solid fa-user"></i>
                    </span>

                    <div>
                        <h1>Acesse sua conta</h1>
                        <p>Entre para continuar na SPAN Games.</p>
                    </div>
                </div>


                <form id="formLogin" novalidate>

                    <!-- LOGIN -->
                    <div class="campo-login">

                        <label for="login">
                            Login
                        </label>

                        <div class="input-login">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="text"
                                id="login"
                                name="login"
                                placeholder="Digite seu login"
                                maxlength="6"
                                autocomplete="username"
                            >

                        </div>

                        <span
                            class="mensagem-erro"
                            id="erroLogin"
                        ></span>

                    </div>


                    <!-- SENHA -->
                    <div class="campo-login">

                        <label for="senha">
                            Senha
                        </label>

                        <div class="input-login">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Digite sua senha"
                                maxlength="8"
                                autocomplete="current-password"
                            >

                            <button
                                type="button"
                                class="mostrar-senha"
                                id="mostrarSenha"
                                aria-label="Mostrar senha"
                            >
                                <i class="fa-regular fa-eye"></i>
                            </button>

                        </div>

                        <span
                            class="mensagem-erro"
                            id="erroSenha"
                        ></span>

                    </div>


                    <!-- ERRO GERAL -->
                    <div
                        class="erro-login"
                        id="erroGeral"
                    ></div>


                    <!-- BOTÃO -->
                    <button
                        type="submit"
                        class="btn-entrar"
                    >
                        <i class="fa-solid fa-right-to-bracket"></i>
                        Acessar conta
                    </button>


                    <a
                        href="#"
                        class="esqueci-senha"
                    >
                        Esqueci minha senha
                    </a>

                </form>

            </section>


            <!-- LADO CADASTRO -->
            <section class="cadastro-card">

                <div class="cadastro-icone">
                    <i class="fa-solid fa-user-plus"></i>
                </div>

                <h2>Novo por aqui?</h2>

                <p>
                    Crie sua conta e aproveite todos os
                    benefícios de ser um cliente
                    <strong>SPAN GAMES</strong>.
                </p>

                <a
                    href="cadastro.html"
                    class="btn-criar-conta"
                >
                    Criar conta
                </a>

            </section>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        <div class="footer-final">

            <p>
                © 2026 SPAN Games — Todos os direitos reservados.
            </p>

        </div>

    </footer>


    <!-- JS -->
    <script src="js/header2.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
