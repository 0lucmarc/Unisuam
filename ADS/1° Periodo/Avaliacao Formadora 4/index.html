<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo de Formulario</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .campo { margin-bottom: 10px; }
        input.invalido, select.invalido { border: 2px solid #e53935; outline: none; }
        span[id^="erro"] { display: block; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>Formulario</h1>
    <form id="formCadastro" novalidate>
        <div class="campo">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            <span id="erroNome" style="color: red; font-size: 0.9em;"></span>
        </div>
        <div class="campo">
            <label for="data-nascimento">Data de Nascimento:</label>
            <input type="date" id="data-nascimento" name="data-nascimento" required>
            <span id="erroDataNascimento" style="color: red; font-size: 0.9em;"></span>
        </div>
        <div class="campo">
            <label for="sexo">Sexo:</label>
            <select id="sexo" name="sexo" required>
                <option value="">Selecione</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
            </select>
            <span id="erroSexo" style="color: red; font-size: 0.9em;"></span>
        </div>
        <div class="campo">
            <label for="nome-materno">Nome Materno:</label>
            <input type="text" id="nome-materno" name="nome-materno" required>
            <span id="erroNomeMaterno" style="color: red; font-size: 0.9em;"></span>
        </div>
        <div class="campo">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required>
            <span id="erroCPF" style="color: red; font-size: 0.9em;"></span>
        </div>
        <div class="campo">
            <label for="telefone-celular">Telefone Celular:</label>
            <input type="text" id="telefone-celular" name="telefone-celular" required>
            <span id="erroTelefoneCelular" style="color: red; font-size: 0.9em;"></span>
        </div>
        <div class="campo">
            <label for="telefone-fixo">Telefone Fixo:</label>
            <input type="text" id="telefone-fixo" name="telefone-fixo" required>
            <span id="erroTelefoneFixo" style="color: red; font-size: 0.9em;"></span>
        </div>
        <div class="campo">
            <label for="endereco-completo">Endereço Completo:</label>
            <input type="text" id="endereco-completo" name="endereco-completo" required>
            <span id="erroEnderecoCompleto" style="color: red; font-size: 0.9em;"></span>
        </div>
        <div class="campo">
            <label for="login">Login:</label>
            <input type="text" id="login" name="login" required>
            <span id="erroLogin" style="color: red; font-size: 0.9em;"></span>
        </div>
        <div class="campo">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
            <span id="erroSenha" style="color: red; font-size: 0.9em;"></span>
        </div>
        <div class="campo">
            <label for="confirmar-senha">Confirmar Senha:</label>
            <input type="password" id="confirmar-senha" name="confirmar-senha" required>
            <span id="erroConfirmarSenha" style="color: red; font-size: 0.9em;"></span>
        </div>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
    <script src="regras.js" defer></script>
</body>
</html>
